<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WASTANAKE - Cultivos Inteligentes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .bg-agro {
            background-color: #2c5f2d; /* Verde oscuro agrícola */
        }
        .btn-custom {
            background-color: #97bc62; /* Verde claro */
            border: none;
        }
        .btn-custom:hover {
            background-color: #7a9f4c;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="bg-light">
    <!-- Navbar Agrícola -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-agro shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">
                <i class="bi bi-tree-fill me-2"></i>WASTANAKE
            </a>
            <div class="navbar-nav">
                {% if user.is_authenticated %}
                    <span class="navbar-text me-3">
                        <i class="bi bi-person-circle"></i> Hola, {{ user.username }}
                    </span>
                    <form action="{% url 'logout' %}" method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light">
                            <i class="bi bi-box-arrow-right"></i> Salir
                        </button>
                    </form>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <main class="container my-5">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer Simple -->
    <footer class="bg-agro text-white mt-auto py-3">
        <div class="container text-center">
            <small>© 2024 WASTANAKE - Herramienta para agricultores inteligentes</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
