{% extends "core/base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-primary">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-calendar"></i>
                        Selecciona un Rango de Fechas
                    </h4>
                </div>
                <div class="card-body">
                    <form method="post" action="{% url 'terrain_analysis' terrain.id %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="dateRange" class="form-label">Rango de Fechas </label>
                            <input type="text" id="dateRange" name="date_range" class="form-control" placeholder="Selecciona un rango de fechas">
                            <small class="text-secondary">Máximo 300 días a partir de la fecha de hoy*</small>
                        </div>
                        <div class="d-flex justify-content-between">
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-check-circle"></i> Enviar
                            </button>
                            <a href="{% url 'home' %}" class="btn btn-outline-secondary">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Flatpickr Range Calendar -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://npmcdn.com/flatpickr/dist/flatpickr.min.js"></script>
<script src="https://npmcdn.com/flatpickr/dist/l10n/es.js"></script>
<link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/material_green.css">
<script>
    document.addEventListener("DOMContentLoaded", function () {
        flatpickr("#dateRange", {
            mode: "range",
            dateFormat: "Y-m-d",
            minDate: "today",
            maxDate: new Date().fp_incr(299),
            locale: "es"
        });
    });
</script>
{% endblock %}
